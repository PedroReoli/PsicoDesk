name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: TypeScript, testes e builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar tipos
        run: npm run typecheck

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Gerar builds
        run: npm run build

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust, SQLCipher e testes locais
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Instalar Perl nativo para OpenSSL
        shell: powershell
        run: choco install strawberryperl --yes --no-progress

      - name: Instalar dependências frontend
        run: npm ci

      - name: Validar formatação Rust
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Validar backend desktop
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Executar testes Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib --locked
