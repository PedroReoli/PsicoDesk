[package]
name = "psicodesk"
version = "0.1.0"
description = "PsicoDesk — gestão clínica local e segura"
authors = ["PsicoDesk contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.77.2"

[lib]
name = "psicodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "=2.1.1"
futures-util = "0.3.34"
hex = "0.4"
rand = "0.8"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.32", features = ["backup", "bundled-sqlcipher-vendored-openssl", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"

