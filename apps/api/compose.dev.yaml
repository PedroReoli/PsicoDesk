name: psicodesk-api-dev

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        mcli alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mcli mb --ignore-existing "local/$${S3_BUCKET}";
        mcli anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?defina S3_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/migrate.js']
    environment: &api-environment
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:?defina POSTGRES_USER}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      DEVICE_SECRET_PEPPER: ${DEVICE_SECRET_PEPPER:?defina DEVICE_SECRET_PEPPER}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:?defina S3_BUCKET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    ports:
      - '127.0.0.1:${API_PORT:-8787}:8787'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
    name: psicodesk-api-postgres-data
  minio-data:
    name: psicodesk-api-minio-data
